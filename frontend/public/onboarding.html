<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — FinPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#10b981;
      --primary-dark:#059669;
      --primary-light:#ecfdf5;
      --surface:#ffffff;
      --border:#e2e8f0;
      --text:#0f172a;
      --muted:#64748b;
      --success:#059669;
      --radius:8px;
    }
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      min-height:100vh;
      background:#f8fafc;
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .container{width:100%;max-width:560px;position:relative;z-index:1}
    .header{text-align:center;margin-bottom:32px}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;text-decoration:none}
    .brand-icon{width:40px;height:40px;background:var(--primary);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:20px;color:white}
    .brand-name{font-size:18px;font-weight:700;color:var(--text)}
    .step-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
    .step{width:32px;height:4px;border-radius:2px;background:#e2e8f0;transition:all .3s}
    .step.active{background:var(--primary);width:48px}
    .step.done{background:var(--success)}
    h1{font-size:24px;font-weight:800;margin-bottom:6px;color:var(--text)}
    .subtitle{font-size:13px;color:var(--muted)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.06),0 2px 4px -2px rgba(0,0,0,0.04)}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:12px;color:var(--text);margin-bottom:6px;font-weight:600}
    .form-input{width:100%;padding:10px 14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:var(--radius);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
    .form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,0.1)}
    .form-input::placeholder{color:#94a3b8}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .option-group{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .option-btn{padding:10px;border:1px solid #cbd5e1;border-radius:var(--radius);background:#ffffff;color:var(--muted);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;text-align:center;transition:all .15s}
    .option-btn:hover{border-color:#94a3b8;color:var(--text)}
    .option-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600}
    .btn-nav{display:flex;gap:12px;margin-top:24px}
    .btn-back{flex:1;padding:11px;background:#ffffff;border:1px solid #cbd5e1;border-radius:var(--radius);color:var(--text);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
    .btn-back:hover{background:#f8fafc;border-color:#94a3b8}
    .btn-next{flex:2;padding:11px;background:var(--primary);border:1px solid transparent;border-radius:var(--radius);color:white;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-next:hover:not(:disabled){background:var(--primary-dark);box-shadow:0 2px 6px rgba(16,185,129,0.25)}
    .btn-next:disabled{opacity:.6;cursor:not-allowed}
    .hint{font-size:11px;color:var(--muted);margin-top:4px}
    .skip-link{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:none;cursor:pointer}
    .skip-link:hover{color:var(--primary)}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    :root.dark-mode, :root:not(.light-mode) {
      color-scheme: dark;
      --surface: #141825;
      --border: #2a2f45;
      --text: #e8ecf4;
      --muted: #8b95b0;
    }
    :root.dark-mode body, :root:not(.light-mode) body {
      background: #0c0f1a;
      color: #e8ecf4;
    }
    :root.dark-mode .card, :root:not(.light-mode) .card {
      background: #141825;
      border-color: #2a2f45;
      box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.4);
    }
    :root.dark-mode .form-input, :root:not(.light-mode) .form-input {
      background: #1c2035;
      color: #e8ecf4;
      border-color: #2a2f45;
    }
    :root.dark-mode .option-btn, :root:not(.light-mode) .option-btn {
      background: #1c2035;
      color: #e8ecf4;
      border-color: #2a2f45;
    }
    :root.dark-mode .step, :root:not(.light-mode) .step {
      background: #2a2f45;
    }
    .custom-budget-panel {
      margin-top: 14px;
      padding: 16px;
      background: var(--surface-2, rgba(16, 185, 129, 0.04));
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .custom-cat-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .custom-cat-name { flex: 2; }
    .custom-cat-pct { flex: 1; min-width: 70px; }
    .custom-cat-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 6px;
      font-size: 16px;
      border-radius: 6px;
    }
    .custom-cat-remove:hover { background: rgba(239, 68, 68, 0.1); }
    .custom-total-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }
    .custom-total-badge.valid { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .custom-total-badge.invalid { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

  </style>
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="brand">
        <div class="brand-icon"><i class="ri-line-chart-line"></i></div>
        <span class="brand-name">FinPro</span>
      </a>
      <div class="step-indicator">
        <div class="step active" id="s1"></div>
        <div class="step" id="s2"></div>
        <div class="step" id="s3"></div>
      </div>
      <h1 id="stepTitle">Tell us about yourself</h1>
      <p class="subtitle" id="stepSub">We'll personalize your financial plan</p>
    </div>

    <div class="card">
      <!-- Step 1: Basic Info -->
      <div id="step1">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Age</label>
            <input type="number" id="age" class="form-input" placeholder="25" min="18" max="100">
          </div>
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" id="city" class="form-input" placeholder="Mumbai">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Monthly Salary / Primary Income (₹)</label>
            <input type="number" id="monthlySalary" class="form-input" placeholder="50000" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">Other Monthly Income (₹)</label>
            <input type="number" id="otherIncome" class="form-input" placeholder="0" min="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Estimated Monthly Expenses (₹)</label>
          <input type="number" id="monthlyExpenses" class="form-input" placeholder="30000" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">Current Savings / Bank Balance (₹)</label>
          <input type="number" id="currentSavings" class="form-input" placeholder="100000" min="0">
        </div>
      </div>

      <!-- Step 2: Debt & Investments -->
      <div id="step2" style="display:none">
        <div class="form-group">
          <label class="form-label">Total Outstanding Debt / Loans (₹) — enter 0 if none</label>
          <input type="number" id="totalDebt" class="form-input" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">Risk Tolerance</label>
          <div class="option-group" id="riskGroup">
            <button class="option-btn" data-val="CONSERVATIVE" onclick="select('riskGroup',this)">🛡️ Conservative</button>
            <button class="option-btn selected" data-val="MODERATE" onclick="select('riskGroup',this)">⚖️ Moderate</button>
            <button class="option-btn" data-val="AGGRESSIVE" onclick="select('riskGroup',this)">🚀 Aggressive</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Budget Method</label>
          <div class="option-group" id="budgetGroup">
            <button class="option-btn selected" data-val="FIFTY_THIRTY_TWENTY" onclick="select('budgetGroup',this)">50/30/20</button>
            <button class="option-btn" data-val="ZERO_BASED" onclick="select('budgetGroup',this)">Zero-Based</button>
            <button class="option-btn" data-val="CUSTOM" onclick="select('budgetGroup',this)">Custom</button>
          </div>
        </div>
        <div id="customBudgetContainer" class="custom-budget-panel" style="display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:13px;font-weight:600;color:var(--text);">Custom Budget Allocations</span>
            <button type="button" class="btn-back" style="padding:4px 8px;font-size:11px;" onclick="resetCustomBudget()">Reset Defaults</button>
          </div>
          <div id="customCategoriesList"></div>
          <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
            <button type="button" class="btn-back" style="padding:6px 12px;font-size:12px;display:inline-flex;" onclick="addCustomCategory()"><i class="ri-add-line"></i> Add Category</button>
            <div id="customTotalBadge" class="custom-total-badge valid">
              <span>Total: <strong id="customTotalDisplay">100%</strong></span>
            </div>
          </div>
          <div id="customBudgetError" style="color:#ef4444;font-size:12px;margin-top:6px;display:none;"></div>
        </div>

      </div>

      <!-- Step 3: Goals -->
      <div id="step3" style="display:none">
        <p style="font-size:13px;color:#94a3b8;margin-bottom:20px;line-height:1.6">Almost done! Your financial plan is ready to generate. We'll create a personalized plan based on your inputs.</p>
        <div class="form-group">
          <label class="form-label">Primary Financial Goal</label>
          <div class="option-group" style="grid-template-columns:1fr 1fr;" id="goalGroup">
            <button class="option-btn" data-val="EMERGENCY_FUND" onclick="select('goalGroup',this)">🏦 Emergency Fund</button>
            <button class="option-btn selected" data-val="HOME" onclick="select('goalGroup',this)">🏠 Buy a Home</button>
            <button class="option-btn" data-val="RETIREMENT" onclick="select('goalGroup',this)">🌅 Retirement</button>
            <button class="option-btn" data-val="EDUCATION" onclick="select('goalGroup',this)">🎓 Education</button>
            <button class="option-btn" data-val="INVESTMENT" onclick="select('goalGroup',this)">📈 Grow Wealth</button>
            <button class="option-btn" data-val="OTHER" onclick="select('goalGroup',this)">✨ Other</button>
          </div>
        </div>
        <div id="submitResult" style="display:none;padding:16px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:12px;font-size:13px;color:#6ee7b7;margin-top:16px;"></div>
      </div>

      <div class="btn-nav">
        <button class="btn-back" id="backBtn" style="display:none" onclick="prevStep()">← Back</button>
        <button class="btn-next" id="nextBtn" onclick="nextStep()">
          <span id="nextBtnText">Continue</span><i class="ri-arrow-right-line" id="nextBtnIcon"></i>
          <div class="spinner" id="nextSpinner" style="display:none;"></div>
        </button>
      </div>

      <a class="skip-link" id="skipLink" onclick="skipOnboarding()">Skip for now — I'll set this up later</a>
    </div>
  </div>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_BASE = (!isLocal || window.location.origin.includes(':5001')) ? '/api/v1' : 'http://127.0.0.1:5001/api/v1';

    const token = localStorage.getItem('jf_access_token');
    if (!token) window.location.href = '/login.html';


    // Custom Budget Categories State
    const defaultCustomCategories = [
      { name: 'Needs', percentage: 50 },
      { name: 'Wants', percentage: 30 },
      { name: 'Savings & Investments', percentage: 20 },
    ];
    let customCategories = JSON.parse(localStorage.getItem('jf_custom_budget') || 'null') || JSON.parse(JSON.stringify(defaultCustomCategories));

    function renderCustomCategories() {
      const listEl = document.getElementById('customCategoriesList');
      if (!listEl) return;
      listEl.innerHTML = '';
      customCategories.forEach((cat, idx) => {
        const row = document.createElement('div');
        row.className = 'custom-cat-row';
        row.innerHTML = `
          <input type="text" class="form-input custom-cat-name" value="${cat.name}" placeholder="Category name" oninput="updateCustomCatName(${idx}, this.value)">
          <div style="display:flex;align-items:center;gap:4px;">
            <input type="number" class="form-input custom-cat-pct" value="${cat.percentage}" min="0" max="100" step="1" oninput="updateCustomCatPct(${idx}, this.value)">
            <span style="font-size:13px;color:var(--muted);">%</span>
          </div>
          <button type="button" class="custom-cat-remove" title="Remove" onclick="removeCustomCategory(${idx})"><i class="ri-delete-bin-line"></i></button>
        `;
        listEl.appendChild(row);
      });
      validateCustomBudget();
    }

    function updateCustomCatName(idx, name) {
      customCategories[idx].name = name;
      localStorage.setItem('jf_custom_budget', JSON.stringify(customCategories));
    }

    function updateCustomCatPct(idx, val) {
      const num = Math.max(0, parseFloat(val) || 0);
      customCategories[idx].percentage = num;
      localStorage.setItem('jf_custom_budget', JSON.stringify(customCategories));
      validateCustomBudget();
    }

    function addCustomCategory() {
      customCategories.push({ name: 'Other', percentage: 0 });
      renderCustomCategories();
      localStorage.setItem('jf_custom_budget', JSON.stringify(customCategories));
    }

    function removeCustomCategory(idx) {
      if (customCategories.length <= 1) {
        alert('You must have at least one budget category.');
        return;
      }
      customCategories.splice(idx, 1);
      renderCustomCategories();
      localStorage.setItem('jf_custom_budget', JSON.stringify(customCategories));
    }

    function resetCustomBudget() {
      customCategories = JSON.parse(JSON.stringify(defaultCustomCategories));
      renderCustomCategories();
      localStorage.setItem('jf_custom_budget', JSON.stringify(customCategories));
    }

    function validateCustomBudget() {
      const total = customCategories.reduce((acc, c) => acc + (parseFloat(c.percentage) || 0), 0);
      const badge = document.getElementById('customTotalBadge');
      const display = document.getElementById('customTotalDisplay');
      const errEl = document.getElementById('customBudgetError');
      if (display) display.textContent = `${total}%`;

      const isValid = Math.abs(total - 100) < 0.01;
      if (badge) {
        badge.className = `custom-total-badge ${isValid ? 'valid' : 'invalid'}`;
      }
      if (errEl) {
        if (!isValid) {
          errEl.style.display = 'block';
          errEl.textContent = total < 100 ? `Total is ${total}%. Please add ${100 - total}% more.` : `Total is ${total}%. Please reduce by ${total - 100}%.`;
        } else {
          errEl.style.display = 'none';
        }
      }
      return isValid;
    }

    let currentStep = 1;
    const totalSteps = 3;
    let riskVal = 'MODERATE', budgetVal = 'FIFTY_THIRTY_TWENTY', goalVal = 'HOME';

    function select(groupId, btn) {
      document.querySelectorAll(`#${groupId} .option-btn`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      if (groupId === 'riskGroup') riskVal = btn.dataset.val;
      else if (groupId === 'budgetGroup') {
        budgetVal = btn.dataset.val;
        const panel = document.getElementById('customBudgetContainer');
        if (panel) {
          panel.style.display = budgetVal === 'CUSTOM' ? 'block' : 'none';
          if (budgetVal === 'CUSTOM') renderCustomCategories();
        }
      }
      else if (groupId === 'goalGroup') goalVal = btn.dataset.val;
    }

    const steps = {
      1: { title: 'Tell us about yourself', sub: 'We\'ll personalize your financial plan' },
      2: { title: 'Debt & Preferences', sub: 'Help us understand your financial situation' },
      3: { title: 'Almost there!', sub: 'Generate your personalized financial plan' },
    };

    function updateUI() {
      document.getElementById('stepTitle').textContent = steps[currentStep].title;
      document.getElementById('stepSub').textContent = steps[currentStep].sub;

      for (let i = 1; i <= totalSteps; i++) {
        const el = document.getElementById('step' + i);
        const indicator = document.getElementById('s' + i);
        if (el) el.style.display = i === currentStep ? 'block' : 'none';
        if (indicator) {
          indicator.className = 'step';
          if (i < currentStep) indicator.classList.add('done');
          else if (i === currentStep) indicator.classList.add('active');
        }
      }

      document.getElementById('backBtn').style.display = currentStep > 1 ? 'flex' : 'none';
      document.getElementById('skipLink').style.display = currentStep < totalSteps ? 'block' : 'none';

      const nextBtn = document.getElementById('nextBtnText');
      const nextIcon = document.getElementById('nextBtnIcon');
      if (currentStep === totalSteps) {
        nextBtn.textContent = 'Generate My Plan';
        nextIcon.className = 'ri-magic-line';
      } else {
        nextBtn.textContent = 'Continue';
        nextIcon.className = 'ri-arrow-right-line';
      }
    }

    function prevStep() {
      if (currentStep > 1) { currentStep--; updateUI(); }
    }

    async function nextStep() {
      if (currentStep === 2 && budgetVal === 'CUSTOM') {
        if (!validateCustomBudget()) {
          alert('Custom budget allocations must total exactly 100% before continuing.');
          return;
        }
      }
      if (currentStep < totalSteps) {
        currentStep++;
        updateUI();
      } else {
        await submitOnboarding();
      }
    }

    async function submitOnboarding() {
      const btn = document.getElementById('nextBtn');
      const text = document.getElementById('nextBtnText');
      const icon = document.getElementById('nextBtnIcon');
      const spinner = document.getElementById('nextSpinner');
      btn.disabled = true;
      text.textContent = 'Generating plan...';
      icon.style.display = 'none';
      spinner.style.display = 'block';

      const payload = {
        age: parseInt(document.getElementById('age').value) || 25,
        city: document.getElementById('city').value.trim() || 'India',
        monthlySalary: parseFloat(document.getElementById('monthlySalary').value) || 0,
        otherMonthlyIncome: parseFloat(document.getElementById('otherIncome').value) || 0,
        estimatedMonthlyExpenses: parseFloat(document.getElementById('monthlyExpenses').value) || 0,
        currentSavings: parseFloat(document.getElementById('currentSavings').value) || 0,
        totalDebt: parseFloat(document.getElementById('totalDebt').value) || 0,
        riskProfile: riskVal,
        budgetMethod: budgetVal,
        customBudgetCategories: budgetVal === 'CUSTOM' ? customCategories : undefined,
      };

      try {
        const res = await fetch(`${API_BASE}/onboarding`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.success) {
          const result = document.getElementById('submitResult');
          result.style.display = 'block';
          result.innerHTML = `<strong>🎉 Your financial plan is ready!</strong><br>${data.data.planSummary || 'Financial health score: ' + data.data.healthScore + '/100'}<br><br>Redirecting to dashboard...`;
          setTimeout(() => window.location.href = '/dashboard.html', 2000);
        } else {
          alert(data.error?.message || 'Failed to save onboarding data.');
          btn.disabled = false;
          text.textContent = 'Generate My Plan';
          icon.style.display = 'inline';
          spinner.style.display = 'none';
        }
      } catch (e) {
        alert('Cannot connect to server. Is backend running on port 5001?');
        btn.disabled = false;
        text.textContent = 'Generate My Plan';
        icon.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    function skipOnboarding() {
      if (confirm('Skip onboarding? You can complete it later from Settings.')) {
        window.location.href = '/dashboard.html';
      }
    }

    updateUI();
  </script>
</body>
</html>
