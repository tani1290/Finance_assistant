<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals — FinPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="sidebarRoot"></div>
  <main class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-title">Savings Goals</div>
        <div class="topbar-sub">Track your financial milestones</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="addGoalBtn"><i class="ri-add-line"></i>New Goal</button>
      </div>
    </div>
    <div class="content">
      <!-- Summary -->
      <div class="metrics-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="metric-card">
          <div class="metric-icon mi-blue"><i class="ri-flag-line"></i></div>
          <div class="metric-label">Active Goals</div>
          <div class="metric-value" id="activeGoals">-</div>
          <div class="metric-sub">In progress</div>
        </div>
        <div class="metric-card">
          <div class="metric-icon mi-green"><i class="ri-trophy-line"></i></div>
          <div class="metric-label">Total Saved</div>
          <div class="metric-value" id="totalSaved">₹0</div>
          <div class="metric-sub">Across all goals</div>
        </div>
        <div class="metric-card">
          <div class="metric-icon mi-amber"><i class="ri-target-line"></i></div>
          <div class="metric-label">Total Target</div>
          <div class="metric-value" id="totalTarget">₹0</div>
          <div class="metric-sub">Combined goal value</div>
        </div>
      </div>

      <div id="goalsList">
        <div class="card"><div style="text-align:center;padding:40px;color:#6b7280">Loading goals...</div></div>
      </div>
    </div>
  </main>

  <!-- Add Goal Modal -->
  <div class="modal-overlay" id="addGoalModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create New Goal</span>
        <button class="modal-close" onclick="closeModal('addGoalModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Goal Name</label>
        <input type="text" id="goalName" class="form-input" placeholder="e.g. Emergency Fund, Vacation, New Car">
      </div>
      <div class="form-group">
        <label class="form-label">Goal Type</label>
        <select id="goalType" class="form-select">
          <option value="EMERGENCY_FUND">Emergency Fund</option>
          <option value="VACATION">Vacation</option>
          <option value="HOME">Buy Home</option>
          <option value="CAR">Buy Car</option>
          <option value="EDUCATION">Education</option>
          <option value="RETIREMENT">Retirement</option>
          <option value="WEDDING">Wedding</option>
          <option value="INVESTMENT">Investment</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Target Amount (₹)</label>
        <input type="number" id="goalTarget" class="form-input" placeholder="500000" min="1">
      </div>
      <div class="form-group">
        <label class="form-label">Current Saved (₹)</label>
        <input type="number" id="goalCurrent" class="form-input" placeholder="0" min="0" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">Target Date (optional)</label>
        <input type="date" id="goalDate" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Monthly Contribution (₹)</label>
        <input type="number" id="goalMonthly" class="form-input" placeholder="5000" min="0" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <select id="goalPriority" class="form-select">
          <option value="HIGH">High</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="LOW">Low</option>
        </select>
      </div>
      <div id="goalError" style="color:#fca5a5;font-size:12px;margin-bottom:8px;display:none;"></div>
      <button class="btn btn-primary" style="width:100%" onclick="saveGoal()">
        <i class="ri-check-line"></i> Create Goal
      </button>
    </div>
  </div>

  <!-- Contribute Modal -->
  <div class="modal-overlay" id="contributeModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Add Contribution</span>
        <button class="modal-close" onclick="closeModal('contributeModal')">✕</button>
      </div>
      <p id="contributeGoalName" style="font-size:13px;color:#6ee7b7;margin-bottom:16px;font-weight:600"></p>
      <div class="form-group">
        <label class="form-label">Amount to Add (₹)</label>
        <input type="number" id="contributeAmount" class="form-input" placeholder="5000" min="1">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="confirmContribute()">
        <i class="ri-add-line"></i> Add Contribution
      </button>
    </div>
  </div>

  <script src="/assets/js/sidebar.js"></script>
  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_BASE = (!isLocal || window.location.origin.includes(':5001')) ? '/api/v1' : 'http://127.0.0.1:5001/api/v1';
    const token = localStorage.getItem('jf_access_token');
    if (!token) window.location.href = '/login.html';
    const fmt = (v) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v||0);
    const apiFetch = async (url, opts={}) => {
      const r = await fetch(`${API_BASE}${url}`,{headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(opts.headers||{})},...opts});
      if(r.status===401){localStorage.clear();window.location.href='/login.html';return null;}
      return r.json();
    };

    document.getElementById('sidebarRoot').innerHTML = getSidebar('goals');
    initSidebarUser();

    let selectedGoalId = null;
    const goalIcons = { EMERGENCY_FUND:'🏦', VACATION:'✈️', HOME:'🏠', CAR:'🚗', EDUCATION:'🎓', RETIREMENT:'🌅', WEDDING:'💍', INVESTMENT:'📈', OTHER:'🎯' };
    const priorityColors = { HIGH:'#ef4444', MEDIUM:'#f59e0b', LOW:'#10b981' };

    const loadGoals = async () => {
      const data = await apiFetch('/goals');
      if (!data?.success) {
        document.getElementById('goalsList').innerHTML = '<div class="card"><div style="text-align:center;padding:30px;color:#ef4444">Failed to load goals.</div></div>';
        return;
      }

      const goals = Array.isArray(data.data) ? data.data : (data.data.goals || []);
      const active = goals.filter(g => g.status === 'ACTIVE');
      const totalSaved = goals.reduce((s, g) => s + parseFloat(g.currentAmount), 0);
      const totalTarget = goals.reduce((s, g) => s + parseFloat(g.targetAmount), 0);

      document.getElementById('activeGoals').textContent = active.length;
      document.getElementById('totalSaved').textContent = fmt(totalSaved);
      document.getElementById('totalTarget').textContent = fmt(totalTarget);

      if (!goals.length) {
        document.getElementById('goalsList').innerHTML = `<div class="card"><div class="empty-state"><i class="ri-flag-line"></i><h3>No goals yet</h3><p>Create your first savings goal to start tracking your progress.</p></div></div>`;
        return;
      }

      document.getElementById('goalsList').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">
          ${goals.map(g => {
            const pct = Math.min(g.progress || 0, 100);
            const remaining = parseFloat(g.targetAmount) - parseFloat(g.currentAmount);
            const isCompleted = g.status === 'COMPLETED' || pct >= 100;
            return `<div class="card" style="border:1px solid ${isCompleted?'rgba(16,185,129,.3)':g.status==='PAUSED'?'rgba(245,158,11,.2)':g.priority==='HIGH'?'rgba(239,68,68,.2)':'var(--border)'}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="font-size:24px">${goalIcons[g.goalType]||'🎯'}</div>
                  <div>
                    <div style="font-size:14px;font-weight:700;color:var(--text)">${g.name}</div>
                    <div style="font-size:11px;color:var(--muted,#6b7280)">${g.goalType.replace(/_/g,' ')} · <span style="color:${priorityColors[g.priority]}">${g.priority}</span></div>
                  </div>
                </div>
                <span class="badge ${isCompleted?'badge-green':g.status==='PAUSED'?'badge-amber':'badge-blue'}">${isCompleted?'✅ Done':g.status}</span>
              </div>
              
              <div class="progress-bar" style="margin-bottom:8px">
                <div class="progress-fill ${isCompleted?'green':''}" style="width:${pct}%"></div>
              </div>
              
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted,#6b7280);margin-bottom:10px">
                <span>Saved: <strong style="color:var(--text)">${fmt(g.currentAmount)}</strong></span>
                <span>Target: <strong style="color:var(--text)">${fmt(g.targetAmount)}</strong></span>
              </div>
              
              <div style="font-size:12px;margin-bottom:12px">
                ${isCompleted ? '<span style="color:#10b981">🎉 Goal completed!</span>' : `<span style="color:var(--muted,#6b7280)">Remaining: <strong style="color:var(--text)">${fmt(remaining)}</strong></span>`}
                ${g.targetDate ? `<span style="color:var(--muted,#6b7280);margin-left:8px">· Due: ${new Date(g.targetDate).toLocaleDateString('en-IN',{month:'short',year:'numeric'})}</span>` : ''}
              </div>
              
              <div style="display:flex;gap:8px">
                ${!isCompleted ? `<button class="btn btn-secondary" style="flex:1;padding:7px 10px;font-size:12px" onclick="openContribute('${g.id}','${g.name.replace(/'/g,"\\'")}')"><i class="ri-add-line"></i>Add Savings</button>` : ''}
                <button class="btn-icon-only" onclick="deleteGoal('${g.id}')" style="color:#ef4444" title="Delete"><i class="ri-delete-bin-line"></i></button>
              </div>
            </div>`;
          }).join('')}
        </div>
      `;
    };

    const saveGoal = async () => {
      const name = document.getElementById('goalName').value.trim();
      const targetAmount = parseFloat(document.getElementById('goalTarget').value);
      const currentAmount = parseFloat(document.getElementById('goalCurrent').value) || 0;
      const targetDate = document.getElementById('goalDate').value;
      const monthlyContribution = parseFloat(document.getElementById('goalMonthly').value) || 0;
      const goalType = document.getElementById('goalType').value;
      const priority = document.getElementById('goalPriority').value;
      const errEl = document.getElementById('goalError');

      if (!name) { errEl.textContent='Enter a goal name.'; errEl.style.display='block'; return; }
      if (!targetAmount || targetAmount <= 0) { errEl.textContent='Enter a valid target amount.'; errEl.style.display='block'; return; }
      errEl.style.display='none';

      const res = await apiFetch('/goals',{method:'POST',body:JSON.stringify({name,goalType,targetAmount,currentAmount,targetDate:targetDate||undefined,monthlyContribution,priority})});
      if (res?.success) {
        closeModal('addGoalModal');
        document.getElementById('goalName').value='';
        document.getElementById('goalTarget').value='';
        document.getElementById('goalCurrent').value='0';
        document.getElementById('goalDate').value='';
        document.getElementById('goalMonthly').value='0';
        showToast('Goal created!','success');
        loadGoals();
      } else {
        errEl.textContent=res?.error?.message||'Failed to create goal.';
        errEl.style.display='block';
      }
    };

    const openContribute = (id, name) => {
      selectedGoalId = id;
      document.getElementById('contributeGoalName').textContent = `Adding to: ${name}`;
      document.getElementById('contributeAmount').value = '';
      showModal('contributeModal');
    };

    const confirmContribute = async () => {
      const amount = parseFloat(document.getElementById('contributeAmount').value);
      if (!amount || amount <= 0) { showToast('Enter a valid amount.','error'); return; }
      const res = await apiFetch(`/goals/${selectedGoalId}/contribute`,{method:'PATCH',body:JSON.stringify({amount})});
      if (res?.success) {
        closeModal('contributeModal');
        showToast(res.data.completed ? '🎉 Goal completed!' : `${fmt(amount)} added!`,'success');
        loadGoals();
      } else {
        showToast(res?.error?.message||'Failed.','error');
      }
    };

    const deleteGoal = async (id) => {
      if (!confirm('Delete this goal?')) return;
      const res = await apiFetch(`/goals/${id}`,{method:'DELETE'});
      if (res?.success) { showToast('Goal deleted.','info'); loadGoals(); }
      else showToast(res?.error?.message||'Failed.','error');
    };

    document.getElementById('addGoalBtn').onclick = () => showModal('addGoalModal');

    function showModal(id){document.getElementById(id).classList.add('show');}
    function closeModal(id){document.getElementById(id).classList.remove('show');}
    document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));
    function showToast(msg,type='success'){const t=document.createElement('div');t.style.cssText=`position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.4);`;if(type==='success')t.style.cssText+='background:#065f46;border:1px solid #10b981;color:#6ee7b7;';else if(type==='error')t.style.cssText+='background:#7f1d1d;border:1px solid #ef4444;color:#fca5a5;';else t.style.cssText+='background:#1e1b4b;border:1px solid #10b981;color:#6ee7b7;';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

    loadGoals();
  </script>
</body>
</html>
