<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Calendar — Jinay Finance AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
    .cal-header{background:var(--surface);padding:8px 6px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase}
    .cal-day{background:var(--bg);padding:8px;min-height:80px;position:relative;transition:background .2s;cursor:pointer}
    .cal-day:hover{background:rgba(255,255,255,.03)}
    .cal-day.other-month{opacity:.35}
    .cal-day.today{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2)}
    .cal-num{font-size:12px;font-weight:600;margin-bottom:4px;color:var(--muted)}
    .cal-day.today .cal-num{color:var(--primary-light)}
    .cal-event{font-size:10px;padding:2px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cal-event.emi{background:rgba(239,68,68,.2);color:#fca5a5}
    .cal-event.loan{background:rgba(245,158,11,.15);color:#fde68a}
    .cal-event.goal{background:rgba(16,185,129,.15);color:#6ee7b7}
    .cal-event.custom{background:rgba(16,185,129,.15);color:#6ee7b7}
    .cal-event.sub{background:rgba(5,150,105,.15);color:#c4b5fd}
    .month-nav{display:flex;align-items:center;gap:16px}
    .month-nav button{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:var(--text);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
    .month-nav button:hover{background:rgba(255,255,255,.1)}
    .events-list{display:flex;flex-direction:column;gap:8px}
    .event-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px}
    .event-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  </style>
</head>
<body>
  <div id="sidebarRoot"></div>
  <main class="main-content">
    <div class="topbar">
      <div><div class="topbar-title">Financial Calendar</div><div class="topbar-sub">EMIs, SIPs, subscriptions, and custom reminders</div></div>
      <div class="topbar-actions">
        <div class="month-nav">
          <button onclick="changeMonth(-1)"><i class="ri-arrow-left-s-line"></i></button>
          <span id="monthLabel" style="font-size:14px;font-weight:600;min-width:120px;text-align:center">--</span>
          <button onclick="changeMonth(1)"><i class="ri-arrow-right-s-line"></i></button>
        </div>
        <button class="btn btn-primary" onclick="showModal('addEventModal')"><i class="ri-add-line"></i>Add Event</button>
      </div>
    </div>
    <div class="content">
      <div style="display:grid;grid-template-columns:3fr 1fr;gap:16px">
        <div class="card" style="padding:0;overflow:hidden">
          <div class="calendar-grid">
            <div class="cal-header">Sun</div><div class="cal-header">Mon</div><div class="cal-header">Tue</div>
            <div class="cal-header">Wed</div><div class="cal-header">Thu</div><div class="cal-header">Fri</div><div class="cal-header">Sat</div>
          </div>
          <div class="calendar-grid" id="calendarBody" style="gap:1px;background:var(--border)"></div>
        </div>
        <div>
          <div class="card">
            <div class="card-header"><span class="card-title">Upcoming Events</span></div>
            <div id="eventsList"><div style="text-align:center;padding:20px;color:#6b7280;font-size:12px">Loading...</div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Event Modal -->
  <div class="modal-overlay" id="addEventModal">
    <div class="modal">
      <div class="modal-header"><span class="modal-title">Add Calendar Event</span><button class="modal-close" onclick="closeModal('addEventModal')">✕</button></div>
      <div class="form-group"><label class="form-label">Event Title</label><input type="text" id="evtTitle" class="form-input" placeholder="e.g. Pay electricity bill"></div>
      <div class="form-group"><label class="form-label">Event Type</label>
        <select id="evtType" class="form-select">
          <option value="REMINDER">Reminder</option><option value="EMI_DUE">EMI Due</option>
          <option value="SIP_DATE">SIP Date</option><option value="INSURANCE_DUE">Insurance Due</option>
          <option value="SUBSCRIPTION">Subscription</option><option value="GOAL_MILESTONE">Goal Milestone</option>
          <option value="CUSTOM">Custom</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Date</label><input type="date" id="evtDate" class="form-input"></div>
      <div class="form-group"><label class="form-label">Amount (₹, optional)</label><input type="number" id="evtAmount" class="form-input" placeholder="Leave blank if not applicable"></div>
      <div class="form-group"><label class="form-label">Notes</label><input type="text" id="evtNotes" class="form-input" placeholder="Optional notes"></div>
      <button class="btn btn-primary" style="width:100%" onclick="saveEvent()"><i class="ri-check-line"></i> Save Event</button>
    </div>
  </div>

  <script src="/assets/js/sidebar.js"></script>
  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_BASE = (!isLocal || window.location.origin.includes(':5001')) ? '/api/v1' : 'http://127.0.0.1:5001/api/v1';
    const token = localStorage.getItem('jf_access_token');
    if (!token) window.location.href = '/login.html';
    const fmt = (v) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v||0);
    const apiFetch = async (url, opts={}) => {
      const r = await fetch(`${API_BASE}${url}`,{headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},...opts});
      if(r.status===401){localStorage.clear();window.location.href='/login.html';return null;}
      return r.json();
    };

    document.getElementById('sidebarRoot').innerHTML = getSidebar('calendar');
    initSidebarUser();

    let curYear = new Date().getFullYear();
    let curMonth = new Date().getMonth() + 1;
    let allEvents = [];

    const changeMonth = (delta) => {
      curMonth += delta;
      if (curMonth > 12) { curMonth = 1; curYear++; }
      if (curMonth < 1) { curMonth = 12; curYear--; }
      loadCalendar();
    };

    const eventClass = (type) => {
      if (type === 'EMI_DUE' || type === 'LOAN_PAYMENT') return 'emi';
      if (type === 'SIP_DATE') return 'goal';
      if (type === 'SUBSCRIPTION' || type === 'INSURANCE_DUE') return 'sub';
      if (type === 'GOAL_MILESTONE') return 'goal';
      return 'custom';
    };

    const loadCalendar = async () => {
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('monthLabel').textContent = `${months[curMonth-1]} ${curYear}`;
      document.getElementById('evtDate').value = `${curYear}-${String(curMonth).padStart(2,'0')}-01`;

      const data = await apiFetch(`/calendar/events?month=${curMonth}&year=${curYear}`);
      allEvents = data?.success ? data.data.events || [] : [];

      // Build calendar
      const firstDay = new Date(curYear, curMonth - 1, 1).getDay();
      const daysInMonth = new Date(curYear, curMonth, 0).getDate();
      const daysInPrev = new Date(curYear, curMonth - 1, 0).getDate();
      const today = new Date();
      const isToday = (d, m, y) => d === today.getDate() && m === today.getMonth() + 1 && y === today.getFullYear();

      const eventsMap = {};
      allEvents.forEach(e => {
        const d = new Date(e.eventDate || e.date);
        const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        if (!eventsMap[key]) eventsMap[key] = [];
        eventsMap[key].push(e);
      });

      let cells = '';
      // Previous month padding
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = daysInPrev - i;
        cells += `<div class="cal-day other-month"><div class="cal-num">${d}</div></div>`;
      }
      // Current month
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${curYear}-${curMonth}-${d}`;
        const dayEvts = eventsMap[key] || [];
        const todayCls = isToday(d, curMonth, curYear) ? ' today' : '';
        cells += `<div class="cal-day${todayCls}">
          <div class="cal-num">${d}</div>
          ${dayEvts.slice(0, 2).map(e => `<div class="cal-event ${eventClass(e.eventType||e.type)}" title="${e.title||e.name}">${e.title||e.name||e.loanType||e.serviceName}</div>`).join('')}
          ${dayEvts.length > 2 ? `<div style="font-size:9px;color:#6b7280">+${dayEvts.length-2} more</div>` : ''}
        </div>`;
      }
      // Next month padding
      const remaining = 42 - firstDay - daysInMonth;
      for (let d = 1; d <= remaining; d++) {
        cells += `<div class="cal-day other-month"><div class="cal-num">${d}</div></div>`;
      }

      document.getElementById('calendarBody').innerHTML = cells;

      // Upcoming events list
      const upcomingEvts = allEvents.filter(e => {
        const d = new Date(e.eventDate || e.date);
        return d >= today;
      }).sort((a, b) => new Date(a.eventDate||a.date) - new Date(b.eventDate||b.date)).slice(0, 10);

      if (!upcomingEvts.length) {
        document.getElementById('eventsList').innerHTML = '<div style="text-align:center;padding:16px;font-size:12px;color:#6b7280">No upcoming events this month.</div>';
        return;
      }
      document.getElementById('eventsList').innerHTML = `<div class="events-list">${upcomingEvts.map(e => `
        <div class="event-item">
          <div class="event-dot" style="background:${e.type==='emi'||e.eventType==='EMI_DUE'?'#ef4444':'#10b981'}"></div>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600">${e.title||e.name||e.loanType||e.serviceName}</div>
            <div style="font-size:10px;color:#6b7280">${new Date(e.eventDate||e.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div>
          </div>
          ${e.amount||e.emiAmount||e.cost ? `<div style="font-size:12px;font-weight:600">${fmt(e.amount||e.emiAmount||e.cost)}</div>` : ''}
        </div>
      `).join('')}</div>`;
    };

    const saveEvent = async () => {
      const payload = {
        title: document.getElementById('evtTitle').value.trim(),
        eventType: document.getElementById('evtType').value,
        eventDate: document.getElementById('evtDate').value,
        amount: parseFloat(document.getElementById('evtAmount').value) || undefined,
        notes: document.getElementById('evtNotes').value.trim() || undefined,
      };
      if (!payload.title) { showToast('Enter a title.','error'); return; }
      if (!payload.eventDate) { showToast('Select a date.','error'); return; }
      const res = await apiFetch('/calendar/events',{method:'POST',body:JSON.stringify(payload)});
      if (res?.success) { closeModal('addEventModal'); showToast('Event saved!','success'); loadCalendar(); }
      else showToast(res?.error?.message||'Failed to save.','error');
    };

    function showModal(id){document.getElementById(id).classList.add('show');}
    function closeModal(id){document.getElementById(id).classList.remove('show');}
    document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));
    function showToast(msg,type='success'){const t=document.createElement('div');t.style.cssText=`position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.4);`;if(type==='success')t.style.cssText+='background:#065f46;border:1px solid #10b981;color:#6ee7b7;';else if(type==='error')t.style.cssText+='background:#7f1d1d;border:1px solid #ef4444;color:#fca5a5;';else t.style.cssText+='background:#1e1b4b;border:1px solid #10b981;color:#6ee7b7;';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

    loadCalendar();
  </script>
</body>
</html>
