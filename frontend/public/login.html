<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FinPro</title>
  <meta name="description" content="Sign in to your FinPro account. AI-powered personal finance tracker built for India.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --border: #e2e8f0;
      --border-focus: #10b981;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --error: #dc2626;
      --success: #059669;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: var(--surface-subtle);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse 40% 30% at 20% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 30% 40% at 80% 70%, rgba(245, 158, 11, 0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }

    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .brand-tagline {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0,0,0,0.02);
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 16px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    .form-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .form-input::placeholder { color: var(--text-light); }

    .form-input.error { border-color: var(--error); }
    .form-input.error:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .toggle-password:hover { color: var(--text); background: var(--surface-subtle); }

    .error-message {
      display: none;
      color: var(--error);
      font-size: 12px;
      margin-top: 5px;
      padding-left: 2px;
    }
    .error-message.show { display: block; }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      margin-top: 6px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .forgot-link:hover { color: var(--primary-dark); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: white;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.35);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-google {
      width: 100%;
      padding: 11px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin-top: 12px;
    }

    .btn-google:hover {
      background: var(--surface-subtle);
      border-color: #94a3b8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { color: var(--primary-dark); }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert.show { display: flex; }
    .alert.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .alert.success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Brand -->
    <div class="brand">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon"><i class="ri-line-chart-line"></i></div>
        <span class="brand-name">FinPro</span>
      </a>
      <p class="brand-tagline">AI-Powered Personal Finance & Investment Advisor</p>
    </div>

    <!-- Card -->
    <div class="card">
      <h1 class="card-title">Welcome back</h1>
      <p class="card-subtitle">Sign in to your account to continue</p>

      <!-- Alert -->
      <div id="loginAlert" class="alert">
        <i id="alertIcon" class="ri-error-warning-line"></i>
        <span id="alertMessage">Error message</span>
      </div>

      <form id="loginForm" novalidate>
        <!-- Email / Username -->
        <div class="form-group">
          <label for="emailInput" class="form-label">Email or Username</label>
          <div class="input-wrapper">
            <i class="ri-user-3-line input-icon"></i>
            <input
              id="emailInput"
              type="text"
              class="form-input"
              placeholder="email@example.com or username"
              autocomplete="username"
              required
            >
          </div>
          <span class="error-message" id="emailError">Please enter your email or username</span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="ri-lock-2-line input-icon"></i>
            <input
              id="passwordInput"
              type="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
              <i class="ri-eye-line" id="eyeIcon"></i>
            </button>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
          <span class="error-message" id="passwordError">Please enter your password</span>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <div class="spinner" id="loginSpinner" style="display:none;"></div>
        </button>
      </form>

      <div class="divider">or continue with</div>

      <a href="/api/v1/auth/google" class="btn-google" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </a>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="/signup.html">Create one</a>
    </div>
  </div>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_BASE = (!isLocal || window.location.origin.includes(':5001')) ? '/api/v1' : 'http://127.0.0.1:5001/api/v1';

    // Google callback & hash fragment token handling (secure OAuth transfer)
    const hashParams = new URLSearchParams(window.location.hash ? window.location.hash.substring(1) : '');
    const searchParams = new URLSearchParams(window.location.search);
    const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token');

    if (accessToken) {
      localStorage.setItem('jf_access_token', accessToken);
      if (refreshToken) localStorage.setItem('jf_refresh_token', refreshToken);
      // Clean up URL
      window.history.replaceState({}, document.title, window.location.pathname);
      window.location.href = '/dashboard.html';
    } else if (localStorage.getItem('jf_access_token')) {
      // Redirect if already logged in
      window.location.href = '/dashboard.html';
    }

    // Show session expired message
    if (searchParams.get('session_expired')) {
      showAlert('error', 'Your session has expired. Please sign in again.');
    }
    if (searchParams.get('error') === 'google_auth_failed') {
      showAlert('error', 'Google Sign-In failed or is not configured. Please use email and password.');
    }

    // Check auth providers status
    let googleOAuthEnabled = false;
    let googleClientId = '1024776311502-8jld09q86kqeei2ud56krp4kb2sht67l.apps.googleusercontent.com';
    fetch(`${API_BASE}/auth/providers`)
      .then(res => res.json())
      .then(data => {
        if (data.success && data.data?.google?.enabled) {
          googleOAuthEnabled = true;
          if (data.data.google.clientId) googleClientId = data.data.google.clientId;
          initGoogleSignIn();
        }
      })
      .catch(() => {});

    function handleGoogleCredentialResponse(response) {
      if (!response.credential) return;
      setLoading(true);
      clearAlert();
      fetch(`${API_BASE}/auth/google/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: response.credential, idToken: response.credential }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem('jf_access_token', data.data.accessToken);
          localStorage.setItem('jf_refresh_token', data.data.refreshToken);
          localStorage.setItem('jf_user', JSON.stringify(data.data.user));
          window.location.href = '/dashboard.html';
        } else {
          setLoading(false);
          showAlert('error', data.error?.message || 'Google login failed.');
        }
      })
      .catch(() => {
        setLoading(false);
        showAlert('error', 'Google login network error. Please try again.');
      });
    }

    function initGoogleSignIn() {
      if (window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: handleGoogleCredentialResponse,
        });
      }
    }

    window.addEventListener('load', () => {
      setTimeout(initGoogleSignIn, 500);
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      if (window.google?.accounts?.id) {
        initGoogleSignIn();
        google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            if (googleOAuthEnabled) {
              window.location.href = `${API_BASE}/auth/google`;
            } else {
              showAlert('error', 'Please select your Google account in the popup or sign in with email and password.');
            }
          }
        });
      } else if (googleOAuthEnabled) {
        window.location.href = `${API_BASE}/auth/google`;
      } else {
        showAlert('error', 'Google Sign-In is initializing. Please try again or sign in with email and password.');
      }
    });

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ri-eye-off-line';
      } else {
        input.type = 'password';
        icon.className = 'ri-eye-line';
      }
    });

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      // Validation
      let valid = true;
      if (!email) {
        document.getElementById('emailError').classList.add('show');
        document.getElementById('emailInput').classList.add('error');
        valid = false;
      } else {
        document.getElementById('emailError').classList.remove('show');
        document.getElementById('emailInput').classList.remove('error');
      }

      if (!password) {
        document.getElementById('passwordError').classList.add('show');
        document.getElementById('passwordInput').classList.add('error');
        valid = false;
      } else {
        document.getElementById('passwordError').classList.remove('show');
        document.getElementById('passwordInput').classList.remove('error');
      }

      if (!valid) return;

      setLoading(true);
      clearAlert();

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('jf_access_token', data.data.accessToken);
          localStorage.setItem('jf_refresh_token', data.data.refreshToken);
          localStorage.setItem('jf_user', JSON.stringify(data.data.user));

          // Redirect based on onboarding status
          window.location.href = '/dashboard.html';
        } else {
          showAlert('error', data.error?.message || 'Login failed. Please check your credentials.');
        }
      } catch (err) {
        showAlert('error', 'Unable to connect to server. Is the backend running on port 5001?');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      const text = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      btn.disabled = loading;
      text.textContent = loading ? 'Signing in...' : 'Sign In';
      spinner.style.display = loading ? 'block' : 'none';
    }

    function showAlert(type, message) {
      const alert = document.getElementById('loginAlert');
      const msg = document.getElementById('alertMessage');
      const icon = document.getElementById('alertIcon');
      alert.className = `alert show ${type}`;
      msg.textContent = message;
      icon.className = type === 'error' ? 'ri-error-warning-line' : 'ri-checkbox-circle-line';
    }

    function clearAlert() {
      document.getElementById('loginAlert').classList.remove('show');
    }
  </script>
</body>
</html>
