<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FinPro</title>
  <meta name="description" content="Sign in to your FinPro account. AI-powered personal finance tracker built for India.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --border: #e2e8f0;
      --border-focus: #10b981;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --error: #dc2626;
      --success: #059669;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: var(--surface-subtle);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse 40% 30% at 20% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 30% 40% at 80% 70%, rgba(245, 158, 11, 0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }

    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .brand-tagline {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0,0,0,0.02);
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 16px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    .form-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .form-input::placeholder { color: var(--text-light); }

    .form-input.error { border-color: var(--error); }
    .form-input.error:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .toggle-password:hover { color: var(--text); background: var(--surface-subtle); }

    .error-message {
      display: none;
      color: var(--error);
      font-size: 12px;
      margin-top: 5px;
      padding-left: 2px;
    }
    .error-message.show { display: block; }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      margin-top: 6px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .forgot-link:hover { color: var(--primary-dark); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: white;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.35);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { color: var(--primary-dark); }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert.show { display: flex; }
    .alert.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .alert.success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Brand -->
    <div class="brand">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon"><i class="ri-line-chart-line"></i></div>
        <span class="brand-name">FinPro</span>
      </a>
      <p class="brand-tagline">AI-Powered Personal Finance & Investment Advisor</p>
    </div>

    <!-- Card -->
    <div class="card">
      <h1 class="card-title">Welcome back</h1>
      <p class="card-subtitle">Sign in to your account to continue</p>

      <!-- Alert -->
      <div id="loginAlert" class="alert">
        <i id="alertIcon" class="ri-error-warning-line"></i>
        <span id="alertMessage">Error message</span>
      </div>

      <form id="loginForm" novalidate>
        <!-- Email / Username -->
        <div class="form-group">
          <label for="emailInput" class="form-label">Email or Username</label>
          <div class="input-wrapper">
            <i class="ri-user-3-line input-icon"></i>
            <input
              id="emailInput"
              type="text"
              class="form-input"
              placeholder="email@example.com or username"
              autocomplete="username"
              required
            >
          </div>
          <span class="error-message" id="emailError">Please enter your email or username</span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="ri-lock-2-line input-icon"></i>
            <input
              id="passwordInput"
              type="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
              <i class="ri-eye-line" id="eyeIcon"></i>
            </button>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
          <span class="error-message" id="passwordError">Please enter your password</span>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <div class="spinner" id="loginSpinner" style="display:none;"></div>
        </button>
      </form>

    </div>

    <div class="auth-footer">
      Don't have an account? <a href="/signup.html">Create one</a>
    </div>

    <div class="auth-footer" style="margin-top:12px;">
      <a href="/privacy.html">Privacy Policy</a> ·
      <a href="/terms.html">Terms of Service</a> ·
      <a href="/delete-account.html">Delete account</a>
    </div>
  </div>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_BASE = (!isLocal || window.location.origin.includes(':5001')) ? '/api/v1' : 'http://127.0.0.1:5001/api/v1';

    // Only allow same-origin absolute paths as post-login destinations.
    function safeRedirect(value) {
      if (typeof value !== 'string' || !value) return null;
      if (!value.startsWith('/') || value.startsWith('//')) return null;
      if (value.includes('\\')) return null;
      try {
        const url = new URL(value, window.location.origin);
        if (url.origin !== window.location.origin) return null;
        return url.pathname + url.search + url.hash;
      } catch (_) {
        return null;
      }
    }

    const requestedRedirect = safeRedirect(new URLSearchParams(window.location.search).get('redirect'));

    // Redirect if already logged in
    if (localStorage.getItem('jf_access_token')) {
      window.location.href = requestedRedirect || '/dashboard.html';
    }

    // Show session expired message
    if (new URLSearchParams(window.location.search).get('session_expired')) {
      showAlert('error', 'Your session has expired. Please sign in again.');
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ri-eye-off-line';
      } else {
        input.type = 'password';
        icon.className = 'ri-eye-line';
      }
    });

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      // Validation
      let valid = true;
      if (!email) {
        document.getElementById('emailError').classList.add('show');
        document.getElementById('emailInput').classList.add('error');
        valid = false;
      } else {
        document.getElementById('emailError').classList.remove('show');
        document.getElementById('emailInput').classList.remove('error');
      }

      if (!password) {
        document.getElementById('passwordError').classList.add('show');
        document.getElementById('passwordInput').classList.add('error');
        valid = false;
      } else {
        document.getElementById('passwordError').classList.remove('show');
        document.getElementById('passwordInput').classList.remove('error');
      }

      if (!valid) return;

      setLoading(true);
      clearAlert();

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('jf_access_token', data.data.accessToken);
          localStorage.setItem('jf_refresh_token', data.data.refreshToken);
          localStorage.setItem('jf_user', JSON.stringify(data.data.user));

          // Redirect to the requested same-origin page, otherwise the dashboard
          window.location.href = requestedRedirect || '/dashboard.html';
        } else {
          showAlert('error', data.error?.message || 'Login failed. Please check your credentials.');
        }
      } catch (err) {
        showAlert('error', 'Unable to connect to server. Is the backend running on port 5001?');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      const text = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      btn.disabled = loading;
      text.textContent = loading ? 'Signing in...' : 'Sign In';
      spinner.style.display = loading ? 'block' : 'none';
    }

    function showAlert(type, message) {
      const alert = document.getElementById('loginAlert');
      const msg = document.getElementById('alertMessage');
      const icon = document.getElementById('alertIcon');
      alert.className = `alert show ${type}`;
      msg.textContent = message;
      icon.className = type === 'error' ? 'ri-error-warning-line' : 'ri-checkbox-circle-line';
    }

    function clearAlert() {
      document.getElementById('loginAlert').classList.remove('show');
    }
  </script>
</body>
</html>
