# ====================================================================
# FinPro — Personal Finance & AI Platform
# Render Blueprint Specification (render.yaml)
# Production Deployment with Supabase PostgreSQL + Firebase
# ====================================================================

services:
  - type: web
    name: finpro-finance-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix node-backend install && npm --prefix node-backend run build
    startCommand: cd node-backend && (npx prisma migrate deploy || npx prisma db push --accept-data-loss || true) && node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Server Runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

      # Supabase PostgreSQL Database URL
      # NOTE: For Supabase, use the pooled connection string (port 6543)
      # e.g., postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DATABASE_URL
        sync: false

      # Authentication Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Google Gemini Generative AI
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash

      # Real Market Feeds
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false

      # Financial News Feeds
      - key: MARKETAUX_API_KEY
        sync: false
      - key: MARKETAUX_BASE_URL
        value: https://api.marketaux.com/v1

      # ── Firebase Admin SDK ──────────────────────────────────────────
      # Paste the full contents of your Firebase service account JSON as a single-line string.
      # Get it from: Firebase Console → Project Settings → Service Accounts → Generate new private key
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # CORS & Client Origin
      # Update this once your Vercel frontend URL is known
      - key: FRONTEND_URL
        value: https://finpro-finance-ai.vercel.app
