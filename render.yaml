# ====================================================================
# FinPro — Personal Finance & AI Platform
# Render Blueprint Specification (render.yaml)
# Production Deployment with Supabase PostgreSQL + Firebase
# ====================================================================

services:
  - type: web
    name: finpro-finance-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix node-backend install && npm --prefix node-backend run build
    # Reconciliation runs `prisma migrate deploy`, falling back to an additive
    # `prisma db push` for this db-push-managed database. It reports the real
    # outcome instead of swallowing failures behind `|| true`, and never uses
    # --accept-data-loss. See node-backend/scripts/deploy-migrate.js.
    startCommand: cd node-backend && node scripts/deploy-migrate.js && (node prisma/seed.js || true) && node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Server Runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

      # Supabase PostgreSQL Database URL — used by the running server.
      # The transaction pooler (port 6543) is fine for queries:
      #   postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres?pgbouncer=true
      # but Prisma CANNOT run schema migrations (DDL) through it, which is why
      # a reconciliation connection is needed at deploy time (see DIRECT_URL).
      - key: DATABASE_URL
        sync: false

      # Migration-only connection (OPTIONAL, recommended for Supabase).
      # Set this to the DIRECT connection (db.[ref].supabase.co:5432) or the
      # SESSION pooler (same pooler host as above, but port 5432). Used only by
      # scripts/deploy-migrate.js during deploy. If left unset, that script
      # derives the session pooler from DATABASE_URL automatically. The running
      # server never reads this variable.
      - key: DIRECT_URL
        sync: false

      # Authentication Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Firebase
      - key: FIREBASE_WEB_API_KEY
        sync: false

      # Google Gemini Generative AI
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite

      # Real Market Feeds
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false

      # Financial News Feeds
      - key: MARKETAUX_API_KEY
        sync: false
      - key: MARKETAUX_BASE_URL
        value: https://api.marketaux.com/v1

      # ── Firebase Admin SDK ──────────────────────────────────────────
      # Paste the full contents of your Firebase service account JSON as a single-line string.
      # Get it from: Firebase Console → Project Settings → Service Accounts → Generate new private key
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # CORS & Client Origin
      # Update this once your Vercel frontend URL is known
      - key: FRONTEND_URL
        value: https://finpro-finance-ai.vercel.app
